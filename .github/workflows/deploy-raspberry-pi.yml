name: Deploy HockeySpare to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy after the build passes?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on Raspberry Pi
    runs-on: [self-hosted, Linux, ARM, hockeyspare-pi]
    timeout-minutes: 45

    steps:
      - name: Show runner info
        run: |
          whoami
          hostname
          pwd
          node --version
          npm --version

      - name: Sync production source to main
        run: |
          cd /opt/hockeyspare
          git config --global --add safe.directory /opt/hockeyspare
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Install dependencies when package-lock changes
        run: |
          cd /opt/hockeyspare

          mkdir -p .deploy-cache

          CURRENT_LOCK_HASH=$(sha256sum package-lock.json | awk '{print $1}')
          SAVED_LOCK_HASH=""

          if [ -f .deploy-cache/package-lock.sha256 ]; then
            SAVED_LOCK_HASH=$(cat .deploy-cache/package-lock.sha256)
          fi

          if [ -d node_modules ] && [ "$CURRENT_LOCK_HASH" = "$SAVED_LOCK_HASH" ]; then
            echo "package-lock.json has not changed. Skipping npm ci."
          else
            echo "package-lock.json changed or node_modules missing. Running npm ci."
            npm ci --prefer-offline --no-audit --fund=false
            echo "$CURRENT_LOCK_HASH" > .deploy-cache/package-lock.sha256
          fi

      - name: Generate Prisma client
        env:
            PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
        run: |
            cd /opt/hockeyspare

            if [ ! -f apps/api/.env ]; then
            echo "Missing apps/api/.env on Raspberry Pi"
            exit 1
            fi

            DATABASE_URL=$(grep -E '^DATABASE_URL=' apps/api/.env | head -n 1 | cut -d '=' -f 2-)
            DATABASE_URL="${DATABASE_URL%\"}"
            DATABASE_URL="${DATABASE_URL#\"}"
            DATABASE_URL="${DATABASE_URL%\'}"
            DATABASE_URL="${DATABASE_URL#\'}"

            if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL was not found in apps/api/.env"
            exit 1
            fi

            export DATABASE_URL
            npx prisma generate --schema=apps/api/src/prisma/schema.prisma

      - name: Build shared contracts
        run: |
          cd /opt/hockeyspare
          npm run build -w libs/contracts --if-present

      - name: Build NestJS API
        run: |
          cd /opt/hockeyspare
          npm run build -w apps/api

      - name: Build Angular app
        run: |
          cd /opt/hockeyspare
          npm run build -w apps/web

      - name: Dry run complete
        if: ${{ inputs.deploy != true }}
        run: |
          echo "Build passed on the Raspberry Pi."
          echo "No files were deployed because deploy=false."
          echo "Run this workflow again with deploy=true to publish."

      - name: Deploy Angular static files
        if: ${{ inputs.deploy == true }}
        run: |
          sudo rsync -av --delete \
            /opt/hockeyspare/apps/web/dist/hockeyspare-web/browser/ \
            /var/www/hockeyspare/browser/

      - name: Restart NestJS API
        if: ${{ inputs.deploy == true }}
        run: |
          sudo systemctl restart hockeyspare-api.service
          sudo systemctl status hockeyspare-api.service --no-pager

      - name: Health check local API
        if: ${{ inputs.deploy == true }}
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:3000/api/requests > /dev/null
          echo "HockeySpare API is responding locally."