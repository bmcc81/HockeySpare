name: Deploy HockeySpare to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy after the build passes?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hockeyspare-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build artifacts on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hockeyspare:hockeyspare@localhost:5432/hockeyspare
      JWT_SECRET: ci-only-secret
      CORS_ORIGIN: https://hockeyspare.webinkgraphics.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --fund=false

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/src/prisma/schema.prisma

      - name: Build shared contracts
        run: npm run build -w libs/contracts --if-present

      - name: Build NestJS API
        run: npm run build -w apps/api

      - name: Build Angular app
        run: npm run build -w apps/web

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: hockeyspare-angular-browser
          path: apps/web/dist/hockeyspare-web/browser
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: hockeyspare-api-dist
          path: apps/api/dist
          if-no-files-found: error

  deploy:
    name: Deploy artifacts on Raspberry Pi
    needs: build
    runs-on: [self-hosted, Linux, ARM, hockeyspare-pi]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean up disk space before deploy
        run: bash scripts/pi-cleanup.sh

      - name: Prepare deployment directory
        run: |
          rm -rf /tmp/hockeyspare-deploy
          mkdir -p /tmp/hockeyspare-deploy/angular
          mkdir -p /tmp/hockeyspare-deploy/api

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: hockeyspare-angular-browser
          path: /tmp/hockeyspare-deploy/angular

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: hockeyspare-api-dist
          path: /tmp/hockeyspare-deploy/api

      - name: Dry run complete
        if: ${{ inputs.deploy != true }}
        run: |
          echo "Build artifacts were created successfully."
          echo "Angular artifact:"
          find /tmp/hockeyspare-deploy/angular -maxdepth 2 -type f | head
          echo "API artifact:"
          find /tmp/hockeyspare-deploy/api -maxdepth 2 -type f | head
          echo "No production files were changed because deploy=false."

      - name: Deploy Angular static files
        if: ${{ inputs.deploy == true }}
        run: |
          sudo mkdir -p /var/www/hockeyspare/browser

          sudo rsync -av --delete \
            /tmp/hockeyspare-deploy/angular/ \
            /var/www/hockeyspare/browser/

      - name: Deploy NestJS API dist
        if: ${{ inputs.deploy == true }}
        run: |
          sudo mkdir -p /opt/hockeyspare/apps/api/dist

          sudo rsync -av --delete \
            /tmp/hockeyspare-deploy/api/ \
            /opt/hockeyspare/apps/api/dist/

      - name: Apply pending Prisma migrations
        if: ${{ inputs.deploy == true }}
        # Runs from this job's own checkout ($GITHUB_WORKSPACE), which already has
        # prisma.config.ts, apps/api/src/prisma/schema.prisma, and apps/api/prisma/migrations
        # at the deployed ref. That checkout has no node_modules at all though (only
        # actions/checkout ran, no install), and prisma.config.ts needs the `dotenv`
        # package to load -- so install just that one small package first rather than
        # a full (slow, disk-heavy) npm ci.
        # The production DATABASE_URL lives in the .env file the systemd unit loads,
        # not in this checkout, so it's discovered from the unit and exported here.
        run: |
          ENV_FILE=$(systemctl show hockeyspare-api.service -p EnvironmentFile --value 2>/dev/null | sed 's/^-//')

          if [ -z "$ENV_FILE" ] || [ ! -f "$ENV_FILE" ]; then
            echo "Falling back to the documented default env file path."
            ENV_FILE=/opt/hockeyspare/apps/api/.env
          fi

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: could not locate the hockeyspare-api env file (looked at: $ENV_FILE)." >&2
            echo "Set DATABASE_URL some other way or fix this step before re-running." >&2
            exit 1
          fi

          echo "Loading DATABASE_URL from $ENV_FILE"
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL was not set after loading $ENV_FILE." >&2
            exit 1
          fi

          npm install --no-save --no-audit --fund=false dotenv
          npx --yes prisma@7.5.0 migrate deploy

      - name: Restart NestJS API
        if: ${{ inputs.deploy == true }}
        run: |
          sudo systemctl restart hockeyspare-api.service
          sudo systemctl status hockeyspare-api.service --no-pager

      - name: Health check local API
        if: ${{ inputs.deploy == true }}
        run: |
          sleep 8

          curl -fsS http://127.0.0.1:3000/api/requests > /dev/null
          echo "GET /api/requests passed."

          LOGIN_STATUS=$(curl -s -o /tmp/hockeyspare-login-check.txt -w "%{http_code}" \
            -X POST http://127.0.0.1:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-healthcheck@example.com","password":"wrong-password"}')

          cat /tmp/hockeyspare-login-check.txt
          echo ""

          if [ "$LOGIN_STATUS" -ge 500 ]; then
            echo "Login health check failed with server error: $LOGIN_STATUS"
            exit 1
          fi

          echo "POST /api/auth/login returned $LOGIN_STATUS, API JSON parsing is working."