name: Deploy HockeySpare to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy after the build passes?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hockeyspare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy on Raspberry Pi
    runs-on: [self-hosted, Linux, ARM, hockeyspare-pi]
    timeout-minutes: 45

    env:
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
      BUILD_DIR: /home/pi/hockeyspare-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show runner info
        run: |
          whoami
          hostname
          pwd
          node --version
          npm --version

      - name: Sync source to persistent build directory
        run: |
          mkdir -p "$BUILD_DIR"

          rsync -a --delete \
            --exclude node_modules \
            --exclude .deploy-cache \
            --exclude dist \
            --exclude .git \
            "$GITHUB_WORKSPACE/" \
            "$BUILD_DIR/"

      - name: Install dependencies only when lockfile changes
        timeout-minutes: 25
        run: |
          cd "$BUILD_DIR"

          mkdir -p .deploy-cache

          CURRENT_LOCK_HASH=$(sha256sum package-lock.json | awk '{print $1}')
          SAVED_LOCK_HASH=""

          if [ -f .deploy-cache/package-lock.sha256 ]; then
            SAVED_LOCK_HASH=$(cat .deploy-cache/package-lock.sha256)
          fi

          if [ -d node_modules ] && [ "$CURRENT_LOCK_HASH" = "$SAVED_LOCK_HASH" ]; then
            echo "package-lock.json unchanged. Skipping npm ci."
          else
            echo "package-lock.json changed or node_modules missing. Running npm ci."
            npm ci --prefer-offline --no-audit --fund=false
            echo "$CURRENT_LOCK_HASH" > .deploy-cache/package-lock.sha256
          fi

      - name: Generate Prisma client
        run: |
          cd "$BUILD_DIR"

          if [ ! -f /opt/hockeyspare/apps/api/.env ]; then
            echo "Missing /opt/hockeyspare/apps/api/.env on Raspberry Pi"
            exit 1
          fi

          DATABASE_URL=$(grep -E '^DATABASE_URL=' /opt/hockeyspare/apps/api/.env | head -n 1 | cut -d '=' -f 2-)
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\'}"
          DATABASE_URL="${DATABASE_URL#\'}"

          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL was not found in /opt/hockeyspare/apps/api/.env"
            exit 1
          fi

          export DATABASE_URL
          npx prisma generate --schema=apps/api/src/prisma/schema.prisma

      - name: Build shared contracts
        run: |
          cd "$BUILD_DIR"
          npm run build -w libs/contracts --if-present

      - name: Build NestJS API
        run: |
          cd "$BUILD_DIR"
          npm run build -w apps/api

      - name: Build Angular app
        run: |
          cd "$BUILD_DIR"
          npm run build -w apps/web

      - name: Dry run complete
        if: ${{ inputs.deploy != true }}
        run: |
          echo "Build passed on the Raspberry Pi runner."
          echo "No production files were changed because deploy=false."

      - name: Deploy Angular static files
        if: ${{ inputs.deploy == true }}
        run: |
          sudo mkdir -p /var/www/hockeyspare/browser

          sudo rsync -av --delete \
            "$BUILD_DIR/apps/web/dist/hockeyspare-web/browser/" \
            /var/www/hockeyspare/browser/

      - name: Deploy NestJS API dist
        if: ${{ inputs.deploy == true }}
        run: |
          sudo mkdir -p /opt/hockeyspare/apps/api/dist

          sudo rsync -av --delete \
            "$BUILD_DIR/apps/api/dist/" \
            /opt/hockeyspare/apps/api/dist/

      - name: Restart NestJS API
        if: ${{ inputs.deploy == true }}
        run: |
          sudo systemctl restart hockeyspare-api.service
          sudo systemctl status hockeyspare-api.service --no-pager

      - name: Health check local API
        if: ${{ inputs.deploy == true }}
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:3000/api/requests > /dev/null
          echo "HockeySpare API is responding locally."