name: Test Raspberry Pi SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/hockeyspare_github_actions
          chmod 600 ~/.ssh/hockeyspare_github_actions

      - name: Add host key
        run: |
          ssh-keyscan -p "${{ secrets.RPI_PORT }}" "${{ secrets.RPI_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/hockeyspare_github_actions \
            -p "${{ secrets.RPI_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" \
            "whoami && hostname && pwd"