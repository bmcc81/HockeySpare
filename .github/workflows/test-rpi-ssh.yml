name: Test Raspberry Pi SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/hockeyspare_github_actions
          chmod 600 ~/.ssh/hockeyspare_github_actions

      - name: Test SSH connection through Cloudflare
        run: |
          ssh -i ~/.ssh/hockeyspare_github_actions \
            -p "${{ secrets.RPI_PORT }}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            "${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}" \
            "whoami && hostname && pwd"