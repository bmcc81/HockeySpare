<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="auth-card">
          <div class="mb-4 text-center">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle mb-0">Sign in to HockeySpare</p>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row g-3">

                <div class="col-12">
                    <label for="firstName" class="form-label">First Name</label>
                    <input
                        id="firstName"
                        type="text"
                        formControlName="firstName"
                        class="form-control form-control-lg custom-input"
                        [class.is-invalid]="form.controls.firstName.touched && form.controls.firstName.invalid"
                        placeholder="First Name"
                    />
                    <div
                        class="invalid-feedback d-block"
                        *ngIf="form.controls.firstName.touched && form.controls.firstName.invalid"
                    >
                    <span *ngIf="form.controls.firstName.errors?.['required']">
                        First Name is required.
                    </span>
                    </div>
              </div>
              <div class="col-12">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input
                        id="lastName"
                        type="text"
                        formControlName="lastName"
                        class="form-control form-control-lg custom-input"
                        [class.is-invalid]="form.controls.lastName.touched && form.controls.lastName.invalid"
                        placeholder="Last Name"
                    />
                    <div
                        class="invalid-feedback d-block"
                        *ngIf="form.controls.lastName.touched && form.controls.lastName.invalid"
                    >
                    <span *ngIf="form.controls.lastName.errors?.['required']">
                        Last Name is required.
                    </span>
                    </div>
              </div>
              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input
                  id="email"
                  type="email"
                  formControlName="email"
                  class="form-control form-control-lg custom-input"
                  [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
                  placeholder="name@example.com"
                />
                <div
                  class="invalid-feedback d-block"
                  *ngIf="form.controls.email.touched && form.controls.email.invalid"
                >
                  <span *ngIf="form.controls.email.errors?.['required']">
                    Email is required.
                  </span>
                  <span *ngIf="form.controls.email.errors?.['email']">
                    Enter a valid email address.
                  </span>
                </div>
              </div>

              <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <input
                  id="password"
                  type="password"
                  formControlName="password"
                  class="form-control form-control-lg custom-input"
                  [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
                  placeholder="Enter your password"
                />
                <div
                  class="invalid-feedback d-block"
                  *ngIf="form.controls.password.touched && form.controls.password.invalid"
                >
                  <span *ngIf="form.controls.password.errors?.['required']">
                    Password is required.
                  </span>
                </div>
              </div>

              <div class="col-12" *ngIf="error">
                <div class="alert alert-danger mb-0" role="alert">
                  {{ error }}
                </div>
              </div>

              <div class="col-12 d-grid pt-2">
                <button
                  type="submit"
                  class="btn submit-btn"
                  [disabled]="loading"
                >
                  {{ loading ? 'Signing in...' : 'Sign in' }}
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4 form-footer">
            <p class="mb-0">
              Don’t have an account?
              <a routerLink="/register">Create account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
