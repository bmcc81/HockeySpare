<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card bg-dark bg-opacity-75 border border-light border-opacity-10 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4 text-center">
            <h1 class="h2 fw-bold text-white mb-2">Create account</h1>
            <p class="text-light opacity-75 mb-0">Join HockeySpare</p>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="firstName" class="form-label text-white">First name</label>
                <input
                  id="firstName"
                  type="text"
                  formControlName="firstName"
                  class="form-control form-control-lg"
                  placeholder="First name"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="lastName" class="form-label text-white">Last name</label>
                <input
                  id="lastName"
                  type="text"
                  formControlName="lastName"
                  class="form-control form-control-lg"
                  placeholder="Last name"
                />
              </div>

              <div class="col-12">
                <label for="email" class="form-label text-white">Email</label>
                <input
                  id="email"
                  type="email"
                  formControlName="email"
                  class="form-control form-control-lg"
                  [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
                  placeholder="name@example.com"
                />
                <div
                  class="invalid-feedback d-block"
                  *ngIf="form.controls.email.touched && form.controls.email.invalid"
                >
                  <span *ngIf="form.controls.email.errors?.['required']">Email is required.</span>
                  <span *ngIf="form.controls.email.errors?.['email']">Enter a valid email address.</span>
                </div>
              </div>

              <div class="col-12">
                <label for="password" class="form-label text-white">Password</label>
                <input
                  id="password"
                  type="password"
                  formControlName="password"
                  class="form-control form-control-lg"
                  [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
                  placeholder="Enter your password"
                />
                <div
                  class="invalid-feedback d-block"
                  *ngIf="form.controls.password.touched && form.controls.password.invalid"
                >
                  <span *ngIf="form.controls.password.errors?.['required']">Password is required.</span>
                  <span *ngIf="form.controls.password.errors?.['minlength']">
                    Password must be at least 8 characters.
                  </span>
                  <span *ngIf="form.controls.password.errors?.['maxlength']">
                    Password must be 72 characters or fewer.
                  </span>
                </div>
              </div>

              <div class="col-12">
                <label for="confirmPassword" class="form-label text-white">Confirm password</label>
                <input
                  id="confirmPassword"
                  type="password"
                  formControlName="confirmPassword"
                  class="form-control form-control-lg"
                  [class.is-invalid]="
                    form.controls.confirmPassword.touched &&
                    (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
                  "
                  placeholder="Confirm your password"
                />
                <div
                  class="invalid-feedback d-block"
                  *ngIf="
                    form.controls.confirmPassword.touched &&
                    (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
                  "
                >
                  <span *ngIf="form.controls.confirmPassword.errors?.['required']">
                    Please confirm your password.
                  </span>
                  <span
                    *ngIf="
                      !form.controls.confirmPassword.errors?.['required'] &&
                      form.hasError('passwordMismatch')
                    "
                  >
                    Passwords do not match.
                  </span>
                </div>
              </div>

              <div class="col-12" *ngIf="error">
                <div class="alert alert-danger mb-0" role="alert">
                  {{ error }}
                </div>
              </div>

              <div class="col-12 d-grid pt-2">
                <button
                  type="submit"
                  class="btn btn-primary btn-lg rounded-3 fw-semibold"
                  [disabled]="loading"
                >
                  {{ loading ? 'Creating account...' : 'Register' }}
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0 text-light opacity-75">
              Already have an account?
              <a routerLink="/login" class="link-light fw-semibold text-decoration-none">
                Sign in
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
