<a routerLink="/requests">← Back to Marketplace</a>

<div *ngIf="request$ | async as req; else loading" class="card">
  <h2>Request #{{ req.id }}</h2>

  <p><strong>Type:</strong> {{ req.type }}</p>
  <p><strong>Position:</strong> {{ req.position }}</p>
  <p><strong>Skill:</strong> {{ req.skillLevel }}</p>
  <p><strong>Pay:</strong> ${{ req.payAmount }}</p>

  <p><strong>{{ nameLabel(req) }}:</strong> {{ nameValue(req) }}</p>

  <p><strong>Arena:</strong> {{ req.arena }}</p>
  <p><strong>Time:</strong> {{ req.time }}</p>

  <p *ngIf="req.notes"><strong>Notes:</strong> {{ req.notes }}</p>
</div>

<ng-template #loading>
  <p>Loading request…</p>
</ng-template>
